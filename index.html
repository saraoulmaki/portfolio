<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sara Oulmaki — Engineering &amp; Making</title>
    <meta
      name="description"
      content="Portfolio of Sara Oulmaki, engineering student at Polytech Tours exploring FPGA design, embedded systems, electronics and creative builds."
    />
    <meta name="theme-color" content="#f5efe3" />
    <!-- Apply the saved / system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
